<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Customs Receipt Analyzer</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom entry animation for the list items */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeSlideIn 0.3s ease-out forwards;
      opacity: 0;
    }
    
    /* Ensure padding for floating bottom bar on mobile */
    .pb-safe { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
    
    /* Prevent text selection on clickable items */
    .no-select { -webkit-user-select: none; user-select: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-32 selection:bg-blue-100">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm px-4 pt-6 pb-4">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Receipt Analyzer</h1>
        <p class="text-sm text-slate-500 font-medium mt-1">Japan Trip 2026</p>
      </div>
      <i data-lucide="calculator" class="text-blue-500 w-8 h-8 opacity-80"></i>
    </div>

    <!-- Segmented Control / Tabs -->
    <div class="max-w-2xl mx-auto mt-6 bg-slate-100/80 p-1 rounded-xl flex gap-1">
      <button id="btn-all" onclick="switchTab('all')" class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-lg font-medium text-sm transition-all duration-200 bg-white text-blue-700 shadow-sm">
        <i data-lucide="file-text" class="w-4 h-4"></i>
        All Receipts
      </button>
      <button id="btn-gifts" onclick="switchTab('gifts')" class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-lg font-medium text-sm transition-all duration-200 text-slate-600 hover:text-slate-900 hover:bg-slate-200/50">
        <i data-lucide="gift" class="w-4 h-4"></i>
        Customs Summary
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-2xl mx-auto px-4 pt-6" id="main-content">
    <!-- Populated by JavaScript -->
  </main>

  <!-- Floating Bottom Bar for Totals -->
  <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 p-4 pb-safe z-20">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div>
        <p id="total-label" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Total Statement Value</p>
        <p id="total-amount" class="text-2xl font-black text-slate-900">$0.00</p>
      </div>
      <div id="selected-count-container" class="text-right hidden">
        <p class="text-xs text-slate-500 font-medium">Items Selected</p>
        <p id="selected-count" class="text-lg font-bold text-slate-800">0</p>
      </div>
    </div>
  </div>

  <script>
    // --- Application State ---
    const initialTransactions = [
      { id: 1, date: '29 Jun 2026', store: 'GION KYOKURARA AIR TOKYO', amount: 7.19, isGift: false },
      { id: 2, date: '29 Jun 2026', store: 'KAITENZUSHIMISAKI OOMOR TOKYO', amount: 45.62, isGift: false },
      { id: 3, date: '29 Jun 2026', store: 'MC DONALDS *', amount: 4.95, isGift: false },
      { id: 4, date: '29 Jun 2026', store: 'MIHARU TOKYO', amount: 11.84, isGift: false },
      { id: 5, date: '30 Jun 2026', store: 'POKEMON CENTER TOKYODX', amount: 27.78, isGift: false },
      { id: 6, date: '30 Jun 2026', store: 'SEVEN ELEVEN *', amount: 9.35, isGift: false },
      { id: 7, date: '30 Jun 2026', store: 'SUICA KEITAIKESSAI TOKYO', amount: 9.05, isGift: false },
      { id: 8, date: '30 Jun 2026', store: 'SUICA KEITAIKESSAI TOKYO', amount: 9.05, isGift: false },
      { id: 9, date: '01 Jul 2026', store: 'SEVEN ELEVEN *', amount: 7.70, isGift: false },
      { id: 10, date: '01 Jul 2026', store: 'TOKYO DISNEY RESORT CHIBA', amount: 19.91, isGift: false },
      { id: 11, date: '01 Jul 2026', store: 'TOKYO DISNEY RESORT CHIBA', amount: 24.44, isGift: false },
      { id: 12, date: '01 Jul 2026', store: 'TOKYO DISNEY RESORT CHIBA', amount: 26.07, isGift: false },
      { id: 13, date: '03 Jul 2026', store: 'SHIBUYA 109 -SHIBUYA-KU TOKYO', amount: 64.94, isGift: false },
      { id: 14, date: '03 Jul 2026', store: 'SHIBUYA 109 -SHIBUYA-KU TOKYO', amount: 79.68, isGift: false },
      { id: 15, date: '03 Jul 2026', store: 'SHIBUYA 109 -SHIBUYA-KU TOKYO', amount: 125.50, isGift: false },
      { id: 16, date: '03 Jul 2026', store: 'FAMILY MART *', amount: 2.97, isGift: false },
      { id: 17, date: '04 Jul 2026', store: 'ORIKASASHOTENINC KANAGAWA', amount: 14.39, isGift: false },
      { id: 18, date: '05 Jul 2026', store: 'SEVEN ELEVEN *', amount: 20.14, isGift: false },
      { id: 19, date: '05 Jul 2026', store: 'STARBUCKS COFFEE JAPAN *', amount: 4.34, isGift: false },
      { id: 20, date: '06 Jul 2026', store: 'FAMILY MART *', amount: 4.24, isGift: false },
      { id: 21, date: '06 Jul 2026', store: 'OBASUTE SA TSUKINOSATO NAGA...', amount: 21.17, isGift: false },
      { id: 22, date: '07 Jul 2026', store: 'SEVEN ELEVEN *', amount: 2.07, isGift: false },

      { id: 24, date: '10 Jul 2026', store: 'KYOTO PORTA KYOTO', amount: 37.18, isGift: false },
      { id: 25, date: '10 Jul 2026', store: 'NIJOTYAYA KYOTO', amount: 2.23, isGift: false },
      { id: 26, date: '10 Jul 2026', store: 'SEVEN ELEVEN *', amount: 12.09, isGift: false },

      { id: 28, date: '11 Jul 2026', store: 'SUICA KEITAIKESSAI TOKYO', amount: 9.05, isGift: false },
      { id: 29, date: '12 Jul 2026', store: 'LAWSON *', amount: 16.64, isGift: false },
      { id: 30, date: '12 Jul 2026', store: 'SUGI PHARMACYNISHIKIIC...', amount: 44.46, isGift: false },
      { id: 31, date: '12 Jul 2026', store: 'SUICA KEITAIKESSAI TOKYO', amount: 8.89, isGift: false },
      { id: 32, date: '12 Jul 2026', store: 'UORIKISUISAN PG KYOTO', amount: 6.26, isGift: false },
      { id: 33, date: '13 Jul 2026', store: 'KYOTO PORTA KYOTO', amount: 91.49, isGift: false },
      { id: 34, date: '13 Jul 2026', store: 'KYOTO PORTA KYOTO', amount: 1.86, isGift: false },
      { id: 35, date: '13 Jul 2026', store: 'LAWSON *', amount: 3.84, isGift: false },
      { id: 36, date: '14 Jul 2026', store: 'HIROSHIMA', amount: 161.07, isGift: false },
      { id: 37, date: '14 Jul 2026', store: 'SEVEN ELEVEN *', amount: 7.14, isGift: false },
      { id: 38, date: '15 Jul 2026', store: 'AEON MALL HIROSHIMAFUCH *', amount: 21.34, isGift: false },
      { id: 39, date: '15 Jul 2026', store: 'AEON MALL HIROSHIMAFUCH *', amount: 7.33, isGift: false },
      { id: 40, date: '15 Jul 2026', store: 'LAWSON *', amount: 11.64, isGift: false },
      { id: 41, date: '16 Jul 2026', store: 'SEVEN ELEVEN *', amount: 5.82, isGift: false },
      { id: 42, date: '18 Jul 2026', store: 'SUNDRUG JAPAN', amount: 6.70, isGift: false },
      { id: 43, date: '18 Jul 2026', store: 'VIATOR* IT-1806904675 NEED...', amount: 18.12, isGift: false },
      { id: 44, date: '18 Jul 2026', store: 'VIATOR* IT-1806905087 NEED...', amount: 18.12, isGift: false },
      { id: 45, date: '18 Jul 2026', store: 'VIATOR* IT-1806911503 NEED...', amount: 60.45, isGift: false },
      { id: 46, date: '18 Jul 2026', store: 'DON QUIJOTE DOTONBO 2 *', amount: 79.46, isGift: false },
      { id: 47, date: '18 Jul 2026', store: 'DON QUIJOTE DOTONBORITE *', amount: 17.75, isGift: false },
      { id: 48, date: '19 Jul 2026', store: 'VIATOR* IT-1806911503 NEE... (Refund)', amount: -58.98, isGift: false },
      { id: 49, date: '19 Jul 2026', store: 'TASOGARE COFFEE da ban shi xi q', amount: 37.97, isGift: false },
      { id: 50, date: '20 Jul 2026', store: 'SEVEN ELEVEN *', amount: 11.28, isGift: false }
    ];

    let transactions = [...initialTransactions];
    let activeTab = 'all'; // 'all' or 'gifts'

    // --- Helpers ---
    const formatCurrency = (amount) => {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
      }).format(amount);
    };

    // --- Actions ---
    function toggleGift(id) {
      if (activeTab !== 'all') return; // Only allow toggling in 'all' view
      
      const idx = transactions.findIndex(t => t.id === id);
      if (idx !== -1) {
        transactions[idx].isGift = !transactions[idx].isGift;
        render();
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      
      const btnAll = document.getElementById('btn-all');
      const btnGifts = document.getElementById('btn-gifts');

      if (tab === 'all') {
        btnAll.className = 'flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-lg font-medium text-sm transition-all duration-200 bg-white text-blue-700 shadow-sm';
        btnGifts.className = 'flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-lg font-medium text-sm transition-all duration-200 text-slate-600 hover:text-slate-900 hover:bg-slate-200/50';
      } else {
        btnGifts.className = 'flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-lg font-medium text-sm transition-all duration-200 bg-blue-600 text-white shadow-sm';
        btnAll.className = 'flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-lg font-medium text-sm transition-all duration-200 text-slate-600 hover:text-slate-900 hover:bg-slate-200/50';
      }
      
      render();
    }

    // --- Render Logic ---
    function render() {
      const main = document.getElementById('main-content');
      
      // Filter & Group Data
      const dataToGroup = activeTab === 'all' ? transactions : transactions.filter((t) => t.isGift);
      
      const grouped = dataToGroup.reduce((acc, curr) => {
        if (!acc[curr.date]) acc[curr.date] = [];
        acc[curr.date].push(curr);
        return acc;
      }, {});

      const sortedDates = Object.keys(grouped).sort((a, b) => new Date(a).getTime() - new Date(b).getTime());

      // Generate HTML
      let html = '';
      
      if (sortedDates.length === 0) {
        html = `
          <div class="text-center py-12 px-4 border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50">
            <i data-lucide="gift" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
            <h3 class="text-lg font-semibold text-slate-700">No items found</h3>
            <p class="text-slate-500 mt-1">
              ${activeTab === 'gifts' ? "You haven't marked any items as gifts yet. Go to 'All Receipts' to select some." : "No transactions available."}
            </p>
          </div>
        `;
      } else {
        html += '<div class="space-y-8">';
        
        sortedDates.forEach((date, groupIndex) => {
          const items = grouped[date];
          let dailySubtotal = 0;
          
          html += `
            <div class="animate-in" style="animation-delay: ${groupIndex * 50}ms">
              <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3 pl-2 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-slate-300"></span>
                ${date}
              </h2>
              <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="divide-y divide-slate-100">
          `;

          items.forEach(item => {
            dailySubtotal += item.amount;
            
            const isNegative = item.amount < 0;
            const pointerClass = activeTab === 'all' ? 'cursor-pointer hover:bg-slate-50 active:bg-slate-100' : '';
            const bgClass = isNegative ? 'bg-red-50/30' : '';
            const textClass = isNegative ? 'text-red-700' : 'text-slate-900';
            
            html += `
              <div onclick="toggleGift(${item.id})" class="no-select flex items-center justify-between p-4 min-h-[4.5rem] transition-colors ${pointerClass} ${bgClass}">
                <div class="flex-1 pr-4">
                  <p class="text-base font-semibold ${textClass} leading-tight">
                    ${item.store}
                  </p>
                  <p class="text-sm font-medium text-slate-500 mt-1">
                    ${formatCurrency(item.amount)}
                  </p>
                </div>
                ${activeTab === 'all' ? `
                  <div class="p-1 rounded-lg transition-colors ${item.isGift ? 'text-blue-600 bg-blue-50' : 'text-slate-300'}">
                    <i data-lucide="${item.isGift ? 'check-square' : 'square'}" class="w-7 h-7"></i>
                  </div>
                ` : `
                  <div class="flex items-center gap-1.5 text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-wide">
                    <i data-lucide="gift" class="w-3.5 h-3.5"></i> Gift
                  </div>
                `}
              </div>
            `;
          });

          html += `</div>`; // Close divide-y
          
          if (activeTab === 'gifts' && items.length > 0) {
            html += `
              <div class="bg-slate-50 px-4 py-3 text-right border-t border-slate-100">
                <span class="text-sm text-slate-500 font-medium mr-3">Daily Subtotal:</span>
                <span class="text-sm font-bold text-slate-800">
                  ${formatCurrency(dailySubtotal)}
                </span>
              </div>
            `;
          }
          
          html += `</div></div>`; // Close card and group wrapper
        });
        
        html += '</div>';
      }

      main.innerHTML = html;

      // Update Bottom Bar Totals
      const allTotal = transactions.reduce((sum, t) => sum + t.amount, 0);
      const giftTotal = transactions.filter(t => t.isGift).reduce((sum, t) => sum + t.amount, 0);
      const giftsCount = transactions.filter(t => t.isGift).length;

      document.getElementById('total-label').textContent = activeTab === 'gifts' ? 'Declared Customs Value' : 'Total Statement Value';
      
      const totalEl = document.getElementById('total-amount');
      totalEl.textContent = formatCurrency(activeTab === 'gifts' ? giftTotal : allTotal);
      totalEl.className = `text-2xl font-black ${activeTab === 'gifts' ? 'text-blue-600' : 'text-slate-900'}`;
      
      const countContainer = document.getElementById('selected-count-container');
      if (activeTab === 'gifts') {
        countContainer.classList.remove('hidden');
        document.getElementById('selected-count').textContent = giftsCount;
      } else {
        countContainer.classList.add('hidden');
      }

      // Re-initialize Lucide Icons for newly injected HTML
      lucide.createIcons();
    }

    // Initialize application on load
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      render();
    });
  </script>
</body>
</html>
