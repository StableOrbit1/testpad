<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Tags | Player Photo Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .hidden { display: none !important; }
        input, select { -webkit-appearance: none; }
        .active-scale:active { transform: scale(0.96); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen pb-24 text-center">

    <div id="screen-loading" class="fixed inset-0 z-[200] bg-slate-50 flex items-center justify-center">
        <div class="font-black text-slate-400 uppercase tracking-widest flex items-center gap-3 animate-pulse">
            <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i> Syncing Vault Database...
        </div>
    </div>

    <div id="screen-app" class="hidden">
        <header class="bg-emerald-900 text-white p-6 shadow-2xl sticky top-0 z-50">
            <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <h1 class="text-2xl font-black flex items-center gap-2 tracking-tight uppercase">
                    <i data-lucide="camera" class="w-6 h-6 text-emerald-400"></i> Player Photo Vault
                </h1>
                <p class="text-xs font-bold text-emerald-400 uppercase tracking-widest">Match History & Evidence</p>
            </div>
        </header>

        <main class="max-w-4xl mx-auto p-4 md:p-8 space-y-8">
            
            <!-- Selector Card -->
            <div class="bg-white p-8 md:p-10 rounded-[2.5rem] shadow-xl border border-slate-200 text-left">
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">Select Player to View Match Vault</label>
                <div class="relative">
                    <select id="player-selector" onchange="window.selectPlayer(this.value)" class="w-full p-5 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-slate-800 outline-none focus:border-emerald-500 appearance-none cursor-pointer text-base">
                        <option value="">Choose a player...</option>
                    </select>
                    <div class="absolute inset-y-0 right-5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="chevron-down" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <!-- Stats Overview Card -->
            <div id="vault-stats-container" class="grid grid-cols-3 gap-4 hidden">
                <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm text-center">
                    <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">Total Battles</p>
                    <p id="stat-total" class="text-2xl md:text-3xl font-black text-slate-800">-</p>
                </div>
                <div class="bg-emerald-50 p-5 rounded-3xl border border-emerald-100 shadow-sm text-center">
                    <p class="text-[10px] font-black uppercase tracking-widest text-emerald-600 mb-1">Won (Captured)</p>
                    <p id="stat-won" class="text-2xl md:text-3xl font-black text-emerald-700">-</p>
                </div>
                <div class="bg-rose-50 p-5 rounded-3xl border border-rose-100 shadow-sm text-center">
                    <p class="text-[10px] font-black uppercase tracking-widest text-rose-600 mb-1">Lost (Defeated)</p>
                    <p id="stat-lost" class="text-2xl md:text-3xl font-black text-rose-700">-</p>
                </div>
            </div>

            <!-- Match Grid Container -->
            <section class="space-y-4 text-left">
                <div id="vault-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="col-span-full p-16 text-center text-slate-400 font-bold uppercase tracking-widest border-2 border-dashed border-slate-200 rounded-3xl">
                        Select a player above to inspect their battle history.
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, initializeFirestore, persistentLocalCache, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const DATABASE_FOLDER_NAME = 'friday-harbour-battle-tags';

        let firebaseConfig;
        let activeAppId;
        
        try {
            firebaseConfig = JSON.parse(__firebase_config);
            activeAppId = typeof __app_id !== 'undefined' ? __app_id : DATABASE_FOLDER_NAME;
        } catch (e) {
            firebaseConfig = {
                apiKey: "AIzaSyDf_1RE4hscqVVbHoN7Vvqoylj8elWLUn4",
                authDomain: "battletags-27390.firebaseapp.com",
                projectId: "battletags-27390",
                storageBucket: "battletags-27390.firebasestorage.app",
                messagingSenderId: "930795580018",
                appId: "1:930795580018:web:b82b95d64572483f85f0eb"
            };
            activeAppId = DATABASE_FOLDER_NAME;
        }

        const app = initializeApp(firebaseConfig);
        let db;
        try { db = initializeFirestore(app, { localCache: persistentLocalCache() }); } 
        catch (e) { db = getFirestore(app); }

        let rawPlayers = [];
        let rawMatches = [];
        let selectedPlayer = null;

        // Listen to Database
        function initVault() {
            const qP = collection(db, 'artifacts', activeAppId, 'public', 'data', 'players');
            onSnapshot(qP, (snapshot) => {
                rawPlayers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => a.name.localeCompare(b.name));
                populateDropdown();
            }, (error) => console.error(error));

            const qM = collection(db, 'artifacts', activeAppId, 'public', 'data', 'matches');
            onSnapshot(qM, (snapshot) => {
                rawMatches = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (selectedPlayer) renderPlayerVault(selectedPlayer);
                document.getElementById('screen-loading').classList.add('hidden');
                document.getElementById('screen-app').classList.remove('hidden');
            }, (error) => console.error(error));
        }

        function populateDropdown() {
            const select = document.getElementById('player-selector');
            const currentVal = select.value;
            select.innerHTML = '<option value="">Choose a player...</option>';
            rawPlayers.forEach(p => {
                const opt = new Option(p.name, p.name);
                if (p.name === currentVal) opt.selected = true;
                select.add(opt);
            });
        }

        window.selectPlayer = function(playerName) {
            selectedPlayer = playerName;
            renderPlayerVault(playerName);
        };

        function renderPlayerVault(playerName) {
            const grid = document.getElementById('vault-grid');
            const statsContainer = document.getElementById('vault-stats-container');
            if (!playerName) {
                statsContainer.classList.add('hidden');
                grid.innerHTML = `<div class="col-span-full p-16 text-center text-slate-400 font-bold uppercase tracking-widest border-2 border-dashed border-slate-200 rounded-3xl">Select a player above to inspect their battle history.</div>`;
                return;
            }

            // Find all completed matches involving this player (as winner or loser)
            const playerMatches = rawMatches.filter(m => 
                m.status === 'completed' && 
                m.winner && 
                m.winner !== 'Tie' && 
                (m.winner === playerName || m.loser === playerName)
            ).sort((a, b) => new Date(b.date) - new Date(a.date));

            let wonCount = 0;
            let lostCount = 0;

            playerMatches.forEach(m => {
                if (m.winner === playerName) wonCount++;
                else lostCount++;
            });

            // Update stats counter cards
            document.getElementById('stat-total').innerText = playerMatches.length;
            document.getElementById('stat-won').innerText = wonCount;
            document.getElementById('stat-lost').innerText = lostCount;
            statsContainer.classList.remove('hidden');

            if (playerMatches.length === 0) {
                grid.innerHTML = `<div class="col-span-full p-16 text-center text-slate-400 font-bold uppercase tracking-widest border-2 border-dashed border-slate-200 rounded-3xl">No completed matches found for ${playerName}.</div>`;
                return;
            }

            grid.innerHTML = playerMatches.map(m => {
                const isWin = m.winner === playerName;
                const opponent = isWin ? m.loser : m.winner;
                const statusBadge = isWin 
                    ? `<span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-xl text-[10px] font-black uppercase tracking-widest border border-emerald-200">Won Match (+1 Tag)</span>` 
                    : `<span class="bg-rose-100 text-rose-700 px-3 py-1 rounded-xl text-[10px] font-black uppercase tracking-widest border border-rose-200">Lost Match (-1 Tag)</span>`;
                
                const borderColor = isWin ? 'border-emerald-200 bg-emerald-50/20' : 'border-rose-200 bg-rose-50/20';
                
                const photoBox = m.photoUrl 
                    ? `<a href="${m.photoUrl}" target="_blank" class="block w-full aspect-video md:aspect-[4/3] rounded-2xl overflow-hidden bg-slate-100 border border-slate-200 shadow-inner group"><img src="${m.photoUrl}" alt="Match Evidence" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"></a>`
                    : `<div class="w-full h-32 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-400 font-bold text-xs uppercase tracking-widest gap-2"><i data-lucide="camera-off" class="w-4 h-4"></i> No Photo Evidence</div>`;

                return `
                    <div class="bg-white p-6 rounded-[2.5rem] border-2 ${borderColor} shadow-sm space-y-4 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                ${statusBadge}
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${m.date}</span>
                            </div>
                            <h3 class="text-lg font-black text-slate-800 tracking-tight uppercase">${m.winner} <span class="text-slate-400 text-sm font-bold lowercase mx-1">def.</span> ${m.loser}</h3>
                            <p class="text-xs font-bold text-slate-500 mt-1 uppercase tracking-wider">Score: ${m.score}</p>
                        </div>
                        <div>
                            ${photoBox}
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        initVault();
    </script>
</body>
</html>
