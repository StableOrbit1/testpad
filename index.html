<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattleTags | Epic Photo Mosaic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #020617; /* slate-950 */ overflow-x: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #10b981; }
        
        /* Ensures the grid items are perfectly square and responsive */
        .mosaic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 4px;
            padding: 4px;
        }
        @media (min-width: 768px) {
            .mosaic-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; padding: 8px; }
        }
    </style>
</head>
<body class="text-slate-200 h-screen flex flex-col custom-scrollbar">

    <!-- Loading Screen -->
    <div id="screen-loading" class="fixed inset-0 z-[200] bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-500">
        <i data-lucide="loader-2" class="w-10 h-10 animate-spin text-emerald-500 mb-4"></i>
        <div class="font-black text-slate-400 uppercase tracking-widest text-sm">Syncing Vault...</div>
    </div>

    <!-- Floating Top Nav / Filter -->
    <div class="fixed top-6 left-1/2 -translate-x-1/2 z-40 w-[90%] max-w-lg">
        <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-700/50 p-3 md:p-4 rounded-3xl shadow-2xl flex items-center gap-3 transition-all hover:border-emerald-500/50">
            <div class="w-10 h-10 bg-emerald-500/20 text-emerald-400 rounded-xl flex items-center justify-center shrink-0 shadow-inner border border-emerald-500/30">
                <i data-lucide="search" class="w-5 h-5"></i>
            </div>
            <div class="relative w-full">
                <select id="player-selector" onchange="renderMosaic(this.value)" class="w-full bg-transparent text-white font-bold outline-none cursor-pointer appearance-none text-sm md:text-base">
                    <option value="" class="bg-slate-900 text-white">Global Mosaic (All Evidence)</option>
                </select>
                <div class="absolute inset-y-0 right-2 flex items-center pointer-events-none text-slate-400">
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Center Stage Logo (Pointer Events None allows clicking photos behind it) -->
    <div class="fixed inset-0 z-20 pointer-events-none flex flex-col items-center justify-center">
        <div class="bg-slate-950/60 backdrop-blur-xl border border-emerald-500/30 p-10 md:p-16 rounded-[3rem] shadow-[0_0_100px_rgba(16,185,129,0.15)] flex flex-col items-center justify-center text-center max-w-[90vw] transition-all duration-500 transform scale-100" id="center-emblem">
            <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mb-6 shadow-inner border border-emerald-500/30 hidden md:flex">
                <i data-lucide="camera" class="w-8 h-8"></i>
            </div>
            <h1 id="center-title" class="text-4xl md:text-7xl font-black tracking-tighter text-white drop-shadow-lg leading-none">BATTLE<span class="text-emerald-500">TAGS</span></h1>
            <p id="center-subtitle" class="text-lg md:text-3xl font-black text-emerald-400 tracking-[0.3em] mt-3 drop-shadow-md">2026</p>
        </div>
    </div>

    <!-- The Mosaic Grid -->
    <div id="mosaic-grid" class="mosaic-grid w-full min-h-screen pt-24 pb-24 z-10">
        <!-- Javascript populates photos here -->
    </div>

    <!-- Full Screen Lightbox -->
    <div id="lightbox" class="fixed inset-0 z-[1000] bg-slate-950/95 backdrop-blur-2xl hidden flex-col items-center justify-center p-4 md:p-8 opacity-0 transition-opacity duration-300">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-slate-400 hover:text-white transition-colors bg-slate-800/50 p-4 rounded-full hover:bg-slate-700 shadow-lg">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        <img id="lightbox-img" src="" class="max-w-full max-h-[65vh] rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.5)] object-contain border border-slate-700/50">
        <div class="mt-8 text-center bg-slate-900/50 px-8 py-4 rounded-2xl border border-slate-800 backdrop-blur-sm">
            <h2 id="lightbox-title" class="text-xl md:text-3xl font-black text-white uppercase tracking-tight"></h2>
            <p id="lightbox-score" class="text-sm md:text-base font-black text-emerald-400 uppercase tracking-[0.2em] mt-2"></p>
            <div class="flex justify-center items-center gap-2 mt-3 text-slate-400 text-xs font-bold uppercase tracking-widest">
                <i data-lucide="calendar" class="w-4 h-4"></i> <span id="lightbox-date"></span>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, persistentLocalCache, initializeFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const DATABASE_FOLDER_NAME = 'friday-harbour-battle-tags';

        // Setup Config matching your main app
        let firebaseConfig;
        let activeAppId;
        try {
            firebaseConfig = JSON.parse(__firebase_config);
            activeAppId = typeof __app_id !== 'undefined' ? __app_id : DATABASE_FOLDER_NAME;
        } catch (e) {
            firebaseConfig = {
                apiKey: "AIzaSyDf_1RE4hscqVVbHoN7Vvqoylj8elWLUn4",
                authDomain: "battletags-27390.firebaseapp.com",
                projectId: "battletags-27390",
                storageBucket: "battletags-27390.firebasestorage.app",
                messagingSenderId: "930795580018",
                appId: "1:930795580018:web:b82b95d64572483f85f0eb"
            };
            activeAppId = DATABASE_FOLDER_NAME;
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let db;
        try { db = initializeFirestore(app, { localCache: persistentLocalCache() }); } 
        catch (e) { db = getFirestore(app); }

        let allPlayers = [];
        let allMatchesWithPhotos = [];

        async function init() {
            lucide.createIcons();

            // Authenticate (Try custom token, fallback to anonymous)
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) { console.error("Auth Failed", err); }

            // Fetch Players for Dropdown
            const qP = collection(db, 'artifacts', activeAppId, 'public', 'data', 'players');
            onSnapshot(qP, (snapshot) => {
                allPlayers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => a.name.localeCompare(b.name));
                populateDropdown();
            });

            // Fetch Matches
            const qM = collection(db, 'artifacts', activeAppId, 'public', 'data', 'matches');
            onSnapshot(qM, (snapshot) => {
                const rawMatches = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // Filter down to ONLY completed matches that actually have an image URL
                allMatchesWithPhotos = rawMatches
                    .filter(m => m.status === 'completed' && m.photoUrl && m.winner)
                    .sort((a, b) => new Date(b.date) - new Date(a.date)); // Newest first

                document.getElementById('screen-loading').style.opacity = '0';
                setTimeout(() => document.getElementById('screen-loading').classList.add('hidden'), 500);
                
                // Render initial global mosaic
                renderMosaic('');
            });
        }

        function populateDropdown() {
            const select = document.getElementById('player-selector');
            const currentVal = select.value;
            select.innerHTML = '<option value="" class="bg-slate-900 text-white">Global Mosaic (All Evidence)</option>';
            allPlayers.forEach(p => {
                const opt = new Option(p.name, p.name);
                opt.className = "bg-slate-900 text-white";
                if (p.name === currentVal) opt.selected = true;
                select.add(opt);
            });
        }

        // Make functions globally available for inline HTML handlers
        window.renderMosaic = function(playerName) {
            const grid = document.getElementById('mosaic-grid');
            const centerTitle = document.getElementById('center-title');
            const centerSubtitle = document.getElementById('center-subtitle');

            let displayPhotos = allMatchesWithPhotos;

            // Filter logic and UI text updating
            if (playerName) {
                // Find photos where the selected player was involved
                displayPhotos = allMatchesWithPhotos.filter(m => m.player1 === playerName || m.player2 === playerName || m.winner === playerName || m.loser === playerName);
                centerTitle.innerHTML = `<span class="text-white">${playerName.toUpperCase()}</span>`;
                centerSubtitle.innerText = "PHOTO VAULT";
            } else {
                centerTitle.innerHTML = `BATTLE<span class="text-emerald-500">TAGS</span>`;
                centerSubtitle.innerText = "2026";
            }

            if (displayPhotos.length === 0) {
                grid.innerHTML = `<div class="col-span-full mt-32 flex flex-col items-center justify-center text-slate-500 font-bold uppercase tracking-widest"><i data-lucide="camera-off" class="w-12 h-12 mb-4 opacity-50"></i> No photographic evidence found.</div>`;
                lucide.createIcons();
                return;
            }

            // To make the mosaic look incredibly full and epic even if there are only a few photos, 
            // we will let the CSS grid natively handle it, but we won't artificially duplicate data.
            grid.innerHTML = displayPhotos.map(m => {
                const isTie = m.winner === 'Tie';
                const matchTitle = isTie ? `${m.player1} TIED ${m.player2}` : `${m.winner} DEF. ${m.loser}`;
                // Using an encoded string for the lightbox parameters to handle spaces and special chars
                const matchTitleLightBox = isTie ? `${m.player1} <span class="text-slate-500 lowercase mx-2">tied</span> ${m.player2}` : `${m.winner} <span class="text-emerald-500 lowercase mx-2">def.</span> ${m.loser}`;
                
                return `
                <div onclick="openLightbox('${m.photoUrl}', '${encodeURIComponent(matchTitleLightBox)}', '${m.score}', '${m.date}')" class="relative group cursor-pointer overflow-hidden aspect-square bg-slate-900 rounded-lg">
                    <img src="${m.photoUrl}" alt="Match Photo" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-125 opacity-50 md:opacity-60 group-hover:opacity-100 saturate-50 group-hover:saturate-100" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300?text=Missing+Image'">
                    
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-3 md:p-4">
                        <span class="text-[9px] md:text-[10px] font-black text-emerald-400 uppercase tracking-widest mb-0.5">${m.date}</span>
                        <span class="text-[10px] md:text-sm font-black text-white uppercase tracking-tight leading-tight mb-1">${matchTitle}</span>
                        <span class="text-[9px] md:text-[10px] font-bold text-slate-300 uppercase tracking-wider">${m.score}</span>
                    </div>
                    
                    <div class="absolute top-3 right-3 w-8 h-8 bg-black/60 backdrop-blur-md rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 translate-y-2 group-hover:translate-y-0 border border-slate-700/50">
                        <i data-lucide="maximize-2" class="w-4 h-4 text-white"></i>
                    </div>
                </div>
            `}).join('');

            lucide.createIcons();
        };

        window.openLightbox = function(url, titleHtmlEnc, score, date) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-title').innerHTML = decodeURIComponent(titleHtmlEnc);
            document.getElementById('lightbox-score').innerText = `Score: ${score}`;
            document.getElementById('lightbox-date').innerText = date;
            
            const lb = document.getElementById('lightbox');
            lb.classList.remove('hidden');
            setTimeout(() => lb.classList.remove('opacity-0'), 10);
        };

        window.closeLightbox = function() {
            const lb = document.getElementById('lightbox');
            lb.classList.add('opacity-0');
            setTimeout(() => lb.classList.add('hidden'), 300);
        };

        // Run initialization
        init();
    </script>
</body>
</html>
