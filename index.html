<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Map Explorer</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS and JS for Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Exifr for parsing EXIF data locally -->
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

    <!-- heic2any for converting HEIC to displayable format in browser -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom scrollbar for gallery */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Leaflet popup customization */
        .leaflet-popup-content-wrapper {
            border-radius: 0.5rem;
            padding: 0;
            overflow: hidden;
        }
        .leaflet-popup-content {
            margin: 0;
            width: 250px !important;
        }
        .popup-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }
        .popup-details {
            padding: 12px;
        }
        
        /* Map custom marker */
        .custom-marker {
            display: flex;
            justify-content: center;
            align-items: center;
            background: none;
            border: none;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen w-full overflow-hidden flex flex-col md:flex-row text-slate-800">

    <!-- Sidebar / Control Panel -->
    <aside class="w-full md:w-[400px] h-1/3 md:h-full bg-white shadow-xl z-10 flex flex-col relative">
        <!-- Header -->
        <div class="p-6 border-b border-gray-100 shrink-0">
            <h1 class="text-2xl font-bold flex items-center gap-2 text-indigo-600">
                <i data-lucide="map-pin"></i>
                PhotoMap
            </h1>
            <p class="text-sm text-slate-500 mt-2">Upload photos to plot them based on their GPS metadata. Processed 100% in your browser.</p>
        </div>

        <!-- Dropzone -->
        <div class="p-6 shrink-0">
            <div id="dropzone" class="border-2 border-dashed border-indigo-200 rounded-xl p-8 text-center bg-indigo-50/50 hover:bg-indigo-50 transition-colors cursor-pointer group flex flex-col items-center justify-center relative">
                <input type="file" id="file-input" multiple accept="image/jpeg, image/png, image/webp, image/heic, image/heif, .heic, .heif" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                <i data-lucide="image-plus" class="w-10 h-10 text-indigo-400 group-hover:text-indigo-600 transition-colors mb-3"></i>
                <p class="font-medium text-indigo-800">Click or drag photos here</p>
                <p class="text-xs text-indigo-500/80 mt-1">JPEG, PNG, WEBP, HEIC supported</p>
            </div>
            
            <!-- Status Messages -->
            <div id="status-container" class="mt-4 hidden">
                <div class="flex items-center gap-2 text-sm text-amber-600 bg-amber-50 p-3 rounded-lg border border-amber-100">
                    <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                    <span id="status-message"></span>
                </div>
            </div>
        </div>

        <!-- Gallery -->
        <div class="flex-1 overflow-y-auto p-6 pt-0">
            <!-- Filter Section -->
            <div class="mb-5 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div class="font-semibold text-slate-700 text-sm mb-3 flex items-center justify-between">
                    <span>Evaluation Filters</span>
                    <i data-lucide="filter" class="w-4 h-4 text-slate-400"></i>
                </div>
                
                <div class="space-y-3">
                    <!-- Revenue Filters -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <span class="text-slate-500 text-xs font-medium uppercase tracking-wider w-20">Revenue</span>
                        <div class="flex gap-3 text-sm">
                            <label class="flex items-center gap-1 cursor-pointer hover:text-indigo-600 transition-colors"><input type="checkbox" checked value="H" data-filter="revenue" class="filter-chk accent-indigo-500"> H</label>
                            <label class="flex items-center gap-1 cursor-pointer hover:text-indigo-600 transition-colors"><input type="checkbox" checked value="M" data-filter="revenue" class="filter-chk accent-indigo-500"> M</label>
                            <label class="flex items-center gap-1 cursor-pointer hover:text-indigo-600 transition-colors"><input type="checkbox" checked value="L" data-filter="revenue" class="filter-chk accent-indigo-500"> L</label>
                            <label class="flex items-center gap-1 cursor-pointer hover:text-indigo-600 transition-colors text-slate-400"><input type="checkbox" checked value="U" data-filter="revenue" class="filter-chk accent-indigo-500"> None</label>
                        </div>
                    </div>
                    <!-- Likelihood Filters -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <span class="text-slate-500 text-xs font-medium uppercase tracking-wider w-20">Likelihood</span>
                        <div class="flex gap-3 text-sm">
                            <label class="flex items-center gap-1 cursor-pointer hover:text-indigo-600 transition-colors"><input type="checkbox" checked value="H" data-filter="likelihood" class="filter-chk accent-indigo-500"> H</label>
                            <label class="flex items-center gap-1 cursor-pointer hover:text-indigo-600 transition-colors"><input type="checkbox" checked value="M" data-filter="likelihood" class="filter-chk accent-indigo-500"> M</label>
                            <label class="flex items-center gap-1 cursor-pointer hover:text-indigo-600 transition-colors"><input type="checkbox" checked value="L" data-filter="likelihood" class="filter-chk accent-indigo-500"> L</label>
                            <label class="flex items-center gap-1 cursor-pointer hover:text-indigo-600 transition-colors text-slate-400"><input type="checkbox" checked value="U" data-filter="likelihood" class="filter-chk accent-indigo-500"> None</label>
                        </div>
                    </div>
                </div>
            </div>

            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4 border-t border-gray-100 pt-4">Plotted Photos (<span id="photo-count">0</span>)</h2>
            <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Gallery items will be injected here -->
            </div>
            
            <div id="empty-state" class="text-center py-12 flex flex-col items-center text-slate-400">
                <i data-lucide="map" class="w-12 h-12 mb-3 opacity-20"></i>
                <p class="text-sm">No mapped photos yet.</p>
            </div>
        </div>
    </aside>

    <!-- Map Container -->
    <main class="flex-1 h-2/3 md:h-full relative z-0">
        <div id="map" class="w-full h-full"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'photo-map-explorer';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Initialize Lucide icons
        lucide.createIcons();

        // Application State
        const state = {
            markers: {}, // Changed to object for easier ID lookup
            filters: {
                revenue: new Set(['H', 'M', 'L', 'U']),
                likelihood: new Set(['H', 'M', 'L', 'U'])
            },
            bounds: null
        };

        // Initialize Map
        const map = L.map('map').setView([20, 0], 2);
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // FeatureGroup to hold all markers for easy bounds calculation
        const markersGroup = L.featureGroup().addTo(map);

        // DOM Elements
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const gallery = document.getElementById('gallery');
        const emptyState = document.getElementById('empty-state');
        const photoCountEl = document.getElementById('photo-count');
        const statusContainer = document.getElementById('status-container');
        const statusMessage = document.getElementById('status-message');

        // Setup filter listeners
        document.querySelectorAll('.filter-chk').forEach(chk => {
            chk.addEventListener('change', (e) => {
                const type = e.target.dataset.filter;
                const val = e.target.value;
                if (e.target.checked) {
                    state.filters[type].add(val);
                } else {
                    state.filters[type].delete(val);
                }
                applyFilters();
            });
        });

        async function initializeAppCloud() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                setupCloudSync();
            } catch (error) {
                console.error("Auth error:", error);
                showStatus("Could not connect to cloud storage.");
            }
        }

        function setupCloudSync() {
            if (!auth.currentUser) return;
            
            const photosRef = collection(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'photos');
            
            showStatus("Loading saved photos from cloud...");
            
            onSnapshot(photosRef, (snapshot) => {
                let count = 0;
                
                snapshot.docChanges().forEach(change => {
                    const data = change.doc.data();
                    const docId = change.doc.id;
                    
                    if (change.type === 'added') {
                        addPhotoToMap(docId, data);
                    } else if (change.type === 'modified') {
                        updatePhotoInMap(docId, data);
                    } else if (change.type === 'removed') {
                        removePhotoFromMap(docId);
                    }
                });

                applyFilters();
                
                // Hide empty state if items exist
                if (Object.keys(state.markers).length > 0) {
                    emptyState.classList.add('hidden');
                } else {
                    emptyState.classList.remove('hidden');
                }
                
                // Only zoom to fit on initial load if we have markers
                if (Object.keys(state.markers).length > 0 && !state.bounds) {
                    map.fitBounds(markersGroup.getBounds(), { padding: [50, 50], maxZoom: 16 });
                    state.bounds = true; // Mark as bounded so we don't snap back on every edit
                }
            }, (error) => {
                console.error("Cloud sync error:", error);
                showStatus("Error syncing with cloud.");
            });
        }

        // Start Cloud Connection on load
        // Start Cloud Connection on load
        initializeAppCloud();

        // Custom Map Pin Icon using SVG
        const createCustomIcon = (imageUrl, isKept) => {
            const pinColor = isKept ? 'bg-emerald-500' : 'bg-indigo-500';
            const borderColor = isKept ? 'border-emerald-500' : 'border-indigo-500';
            
            return L.divIcon({
                className: 'custom-marker',
                html: `
                    <div class="relative group cursor-pointer w-12 h-12">
                        <div class="absolute inset-0 bg-white rounded-full shadow-lg border-2 ${borderColor} overflow-hidden transform group-hover:scale-110 transition-transform duration-200 z-10">
                            <img src="${imageUrl}" class="w-full h-full object-cover" alt="pin thumbnail">
                        </div>
                        <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-4 h-4 ${pinColor} rotate-45 z-0 shadow-md"></div>
                    </div>
                `,
                iconSize: [48, 56],
                iconAnchor: [24, 56],
                popupAnchor: [0, -56]
            });
        };

        // Event Listeners for Drag and Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropzone.classList.add('border-indigo-500', 'bg-indigo-100');
        }

        function unhighlight(e) {
            dropzone.classList.remove('border-indigo-500', 'bg-indigo-100');
        }

        // Handle File Selection (Drop or Click)
        dropzone.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files), false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        function showStatus(message) {
            statusMessage.textContent = message;
            statusContainer.classList.remove('hidden');
            setTimeout(() => {
                statusContainer.classList.add('hidden');
            }, 5000);
        }

        // Compresses image to a small base64 string suitable for fast cloud storage
        function createThumbnailBase64(fileOrBlob) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 250; // Keep it small for quick loading
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    // Convert to high-compression JPEG
                    resolve(canvas.toDataURL('image/jpeg', 0.6)); 
                };
                img.src = URL.createObjectURL(fileOrBlob);
            });
        }

        async function handleFiles(files) {
            if (!files || files.length === 0) return;
            if (!auth.currentUser) {
                showStatus("Please wait, connecting to cloud...");
                return;
            }
            
            let filesProcessed = 0;
            let filesWithNoGPS = 0;
            let newMarkersAdded = false;

            showStatus("Processing and safely saving images... (This may take a moment)");

            const photosRef = collection(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'photos');

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const isHeic = file.type === 'image/heic' || file.type === 'image/heif' || file.name.toLowerCase().endsWith('.heic') || file.name.toLowerCase().endsWith('.heif');
                
                if (!file.type.startsWith('image/') && !isHeic) continue;

                filesProcessed++;

                try {
                    // Extract GPS data using exifr (works on original HEIC)
                    const gpsData = await exifr.gps(file);
                    
                    if (gpsData && gpsData.latitude != null && gpsData.longitude != null) {
                        let displayFile = file;

                        // Convert HEIC to JPEG so standard browsers can render it on canvas
                        if (isHeic) {
                            try {
                                const convertedBlob = await heic2any({
                                    blob: file,
                                    toType: "image/jpeg",
                                    quality: 0.6 // Slightly lower quality for faster conversion memory
                                });
                                displayFile = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                                displayFile.name = file.name; // Keep original name for UI
                            } catch (err) {
                                console.error("HEIC conversion failed for", file.name, err);
                                continue;
                            }
                        }

                        // Generate small thumbnail to save in cloud
                        const thumbnailBase64 = await createThumbnailBase64(displayFile);
                        
                        // Save to Cloud Storage (this triggers the onSnapshot listener to update the map automatically)
                        await addDoc(photosRef, {
                            name: file.name,
                            lat: gpsData.latitude,
                            lng: gpsData.longitude,
                            thumbnailBase64: thumbnailBase64,
                            timestamp: Date.now(),
                            revenueRank: 'U',    // Default Unranked
                            likelihoodRank: 'U', // Default Unranked
                            kept: false
                        });

                        newMarkersAdded = true;
                    } else {
                        filesWithNoGPS++;
                    }
                } catch (error) {
                    console.error("Error parsing EXIF for", file.name, error);
                    filesWithNoGPS++;
                }
            }

            // Update UI based on results
            if (filesProcessed === 0) {
                showStatus("Please upload valid image files (JPEG, PNG, WEBP, HEIC).");
            } else if (filesWithNoGPS > 0) {
                showStatus(`${filesWithNoGPS} photo(s) didn't have GPS metadata and were skipped.`);
            } else if (newMarkersAdded) {
                showStatus("Photos successfully saved to your cloud space!");
            }
            
            // Reset input so the same files can be selected again if needed
            fileInput.value = '';
        }

        // --- Core Item Logic ---

        function addPhotoToMap(docId, data) {
            // Create the Marker
            const marker = L.marker([data.lat, data.lng], { 
                icon: createCustomIcon(data.thumbnailBase64, data.kept) 
            });

            // Format coordinates for display
            const latStr = data.lat.toFixed(5);
            const lngStr = data.lng.toFixed(5);

            // Create Popup Content
            const popupContent = `
                <div class="bg-white">
                    <img src="${data.thumbnailBase64}" class="popup-image" alt="Captured photo" />
                    <div class="popup-details">
                        <h3 class="font-semibold text-slate-800 text-sm truncate" title="${data.name}">${data.name}</h3>
                        <p class="text-xs text-slate-500 mt-1 flex items-center gap-1">
                            <i data-lucide="navigation" class="w-3 h-3"></i>
                            ${latStr}, ${lngStr}
                        </p>
                        ${data.kept ? `<div class="mt-2 text-xs font-bold text-emerald-600">✓ Kept</div>` : ''}
                    </div>
                </div>
            `;

            marker.bindPopup(popupContent, { maxWidth: 250 });
            
            // Save to state
            state.markers[docId] = { docId, data, marker, galleryItem: null };

            // Re-initialize lucide icons for the newly injected popup
            marker.on('popupopen', () => {
                lucide.createIcons();
            });

            // Create Sidebar Gallery Card
            createGalleryItem(docId);
        }

        function updatePhotoInMap(docId, data) {
            const item = state.markers[docId];
            if (!item) return;

            item.data = data;
            
            // Update Marker Icon silently (retains popup state if open)
            item.marker.setIcon(createCustomIcon(data.thumbnailBase64, data.kept));
            
            // Update DOM element directly so we don't lose scroll position
            updateGalleryItemDOM(docId);
        }

        function removePhotoFromMap(docId) {
            const item = state.markers[docId];
            if (!item) return;

            // Remove from map & DOM
            item.marker.remove();
            if (item.galleryItem) item.galleryItem.remove();
            
            delete state.markers[docId];
        }

        // --- View & Interaction Logic ---

        function applyFilters() {
            let visibleCount = 0;

            Object.values(state.markers).forEach(item => {
                const isRevenueMatch = state.filters.revenue.has(item.data.revenueRank);
                const isLikelihoodMatch = state.filters.likelihood.has(item.data.likelihoodRank);
                
                const isVisible = isRevenueMatch && isLikelihoodMatch;

                if (isVisible) {
                    item.marker.addTo(markersGroup);
                    if (item.galleryItem) item.galleryItem.style.display = 'flex';
                    visibleCount++;
                } else {
                    item.marker.remove();
                    if (item.galleryItem) item.galleryItem.style.display = 'none';
                }
            });

            photoCountEl.textContent = visibleCount;
        }

        // Helper to generate the rank toggle buttons
        function getRankButtons(docId, category, currentRank) {
            const ranks = ['H', 'M', 'L'];
            let html = '';
            ranks.forEach(r => {
                const isActive = r === currentRank;
                const activeClasses = isActive ? 'bg-indigo-600 text-white border-indigo-600 shadow-inner' : 'bg-white text-slate-600 border-gray-200 hover:bg-slate-50';
                html += `<button onclick="updateRank('${docId}', '${category}', '${r}')" class="flex-1 border text-xs py-1 rounded transition-colors ${activeClasses}">${r}</button>`;
            });
            return html;
        }

        function createGalleryItem(docId) {
            const itemState = state.markers[docId];
            if (!itemState) return;

            const item = document.createElement('div');
            itemState.galleryItem = item;
            
            // Initial render
            updateGalleryItemDOM(docId);
            gallery.prepend(item);
        }

        function updateGalleryItemDOM(docId) {
            const itemState = state.markers[docId];
            if (!itemState || !itemState.galleryItem) return;

            const data = itemState.data;
            const item = itemState.galleryItem;
            
            // Update classes based on kept state
            const borderClass = data.kept ? 'border-emerald-400 shadow-md ring-1 ring-emerald-400' : 'border-gray-200 shadow-sm';
            
            item.className = `flex flex-col bg-white rounded-xl overflow-hidden transition-all border ${borderClass}`;
            
            item.innerHTML = `
                <div class="relative h-32 cursor-pointer group" onclick="flyToMarker('${docId}')">
                    <img src="${data.thumbnailBase64}" class="w-full h-full object-cover" alt="${data.name}">
                    <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors"></div>
                    <button class="absolute bottom-2 right-2 bg-black/50 text-white rounded-full p-1.5 hover:bg-indigo-500 transition-colors shadow-sm" title="View on map">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                    </button>
                    ${data.kept ? '<div class="absolute top-2 right-2 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">KEPT</div>' : ''}
                </div>
                
                <div class="p-3 flex-1 flex flex-col">
                    <h4 class="text-xs font-bold text-slate-800 truncate mb-3" title="${data.name}">${data.name}</h4>
                    
                    <!-- Rankings -->
                    <div class="space-y-2 mb-4">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-semibold text-slate-500 uppercase">Revenue</span>
                            <div class="flex gap-1 w-24">
                                ${getRankButtons(docId, 'revenueRank', data.revenueRank)}
                            </div>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-semibold text-slate-500 uppercase">Likelihood</span>
                            <div class="flex gap-1 w-24">
                                ${getRankButtons(docId, 'likelihoodRank', data.likelihoodRank)}
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-auto pt-3 border-t border-gray-100 flex gap-2">
                        <button onclick="toggleKeep('${docId}')" class="flex-1 flex items-center justify-center gap-1 py-1.5 rounded text-xs font-medium transition-colors ${data.kept ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-slate-100 text-slate-600 hover:bg-emerald-50 hover:text-emerald-600'}">
                            <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                            ${data.kept ? 'Kept' : 'Keep'}
                        </button>
                        <button onclick="deletePhoto('${docId}')" class="flex-1 flex items-center justify-center gap-1 py-1.5 rounded text-xs font-medium bg-red-50 text-red-600 hover:bg-red-100 transition-colors">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            Remove
                        </button>
                    </div>
                </div>
            `;
            
            // Re-initialize icons for this specific element
            lucide.createIcons({ root: item });
        }

        // --- Interaction Functions (Global Scope for inline onclick) ---

        window.flyToMarker = function(docId) {
            const item = state.markers[docId];
            if (!item) return;
            
            map.flyTo([item.data.lat, item.data.lng], 16, { duration: 1.5 });
            
            setTimeout(() => {
                item.marker.openPopup();
            }, 1000);
        };

        window.updateRank = async function(docId, field, value) {
            if (!auth.currentUser) return;
            const item = state.markers[docId];
            if (!item) return;

            // Optimistic UI update
            item.data[field] = value;
            updateGalleryItemDOM(docId);
            applyFilters();

            // Cloud update
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'photos', docId);
                await updateDoc(docRef, { [field]: value });
            } catch (err) {
                console.error("Error updating rank:", err);
                showStatus("Failed to save rank to cloud.");
            }
        };

        window.toggleKeep = async function(docId) {
            if (!auth.currentUser) return;
            const item = state.markers[docId];
            if (!item) return;

            const newKeptStatus = !item.data.kept;
            
            // Optimistic UI update
            item.data.kept = newKeptStatus;
            updateGalleryItemDOM(docId);
            item.marker.setIcon(createCustomIcon(item.data.thumbnailBase64, newKeptStatus));

            // Cloud update
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'photos', docId);
                await updateDoc(docRef, { kept: newKeptStatus });
            } catch (err) {
                console.error("Error updating kept status:", err);
                showStatus("Failed to save status to cloud.");
            }
        };

        window.deletePhoto = async function(docId) {
            if (!auth.currentUser) return;

            // Remove from UI immediately for responsiveness
            removePhotoFromMap(docId);
            applyFilters();

            // Cloud update
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'photos', docId);
                await deleteDoc(docRef);
            } catch (err) {
                console.error("Error deleting photo:", err);
                showStatus("Failed to delete photo from cloud.");
            }
        };

        // Handle Map Resize when window changes
        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
    </script>
</body>
</html>
