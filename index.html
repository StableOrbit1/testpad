<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone Level</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1c1c1e;
            color: white;
            overflow: hidden;
        }
        #permission-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #0a84ff;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(10, 132, 255, 0.4);
        }
        #level-container {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background-color: #2c2c2e;
            border: 6px solid #48484a;
            position: relative;
            display: none;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        /* Level Crosshairs */
        #level-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 5%;
            right: 5%;
            height: 2px;
            background-color: rgba(255,255,255,0.15);
            transform: translateY(-50%);
        }
        #level-container::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 5%;
            bottom: 5%;
            width: 2px;
            background-color: rgba(255,255,255,0.15);
            transform: translateX(-50%);
        }
        /* Center Target Circle */
        .target {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        #bubble {
            width: 44px;
            height: 44px;
            background-color: #32d74b;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.05s linear;
            box-shadow: 0 0 15px rgba(50, 215, 75, 0.8);
            z-index: 2;
        }
        #readout {
            margin-top: 40px;
            font-size: 28px;
            font-variant-numeric: tabular-nums;
            text-align: center;
            display: none;
            line-height: 1.5;
        }
        .highlight {
            color: #32d74b;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <button id="permission-btn">Enable Level Access</button>

    <div id="level-container">
        <div class="target"></div>
        <div id="bubble"></div>
    </div>

    <div id="readout">
        X: <span id="x-val" class="highlight">0</span>&deg; <br>
        Y: <span id="y-val" class="highlight">0</span>&deg;
    </div>

    <script>
        const btn = document.getElementById('permission-btn');
        const levelContainer = document.getElementById('level-container');
        const bubble = document.getElementById('bubble');
        const readout = document.getElementById('readout');
        const xVal = document.getElementById('x-val');
        const yVal = document.getElementById('y-val');

        // Maximum pixel travel for the bubble inside the container
        const maxMove = 115; 

        function handleOrientation(event) {
            // gamma is left-to-right tilt (X axis)
            let x = event.gamma;
            // beta is front-to-back tilt (Y axis)
            let y = event.beta; 

            if (x === null || y === null) return;

            // Cap the angles at 45 degrees so the bubble stays inside the visual circle
            const maxAngle = 45;
            let cappedX = Math.max(-maxAngle, Math.min(maxAngle, x));
            let cappedY = Math.max(-maxAngle, Math.min(maxAngle, y));

            // Calculate movement percentage based on tilt
            let moveX = (cappedX / maxAngle) * maxMove;
            let moveY = (cappedY / maxAngle) * maxMove;

            // Apply translation to the bubble
            bubble.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;

            // Update numerical text readout (rounded to 1 decimal place)
            xVal.innerText = x.toFixed(1);
            yVal.innerText = y.toFixed(1);

            // Change bubble color if perfectly level (within 1 degree)
            if (Math.abs(x) < 1 && Math.abs(y) < 1) {
                bubble.style.backgroundColor = "#32d74b";
                bubble.style.boxShadow = "0 0 20px rgba(50, 215, 75, 1)";
            } else {
                bubble.style.backgroundColor = "#ff9f0a";
                bubble.style.boxShadow = "0 0 15px rgba(255, 159, 10, 0.8)";
            }
        }

        btn.addEventListener('click', () => {
            // Request permission for iOS 13+ devices
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            startApp();
                        } else {
                            alert('Permission denied. Cannot access the device level.');
                        }
                    })
                    .catch(console.error);
            } else {
                // Fallback for older iOS versions or standard Android/Desktop browsers
                window.addEventListener('deviceorientation', handleOrientation);
                startApp();
            }
        });

        function startApp() {
            btn.style.display = 'none';
            levelContainer.style.display = 'block';
            readout.style.display = 'block';
        }
    </script>
</body>
</html>
