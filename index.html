<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattleTags | Evidence Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .active-scale:active { transform: scale(0.98); }
        
        /* Smooth fade for the lightbox */
        .lightbox-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(8px); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen pb-24 flex flex-col custom-scrollbar">

    <!-- Loading Screen -->
    <div id="screen-loading" class="fixed inset-0 z-[200] bg-slate-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <i data-lucide="loader-2" class="w-10 h-10 animate-spin text-emerald-500 mb-4"></i>
        <div class="font-black text-slate-400 uppercase tracking-widest text-sm">Syncing Database...</div>
    </div>

    <!-- Header -->
    <header class="bg-emerald-900 text-white p-6 shadow-2xl sticky top-0 z-40">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-800 rounded-xl flex items-center justify-center text-emerald-400 shadow-inner border border-emerald-700">
                    <i data-lucide="camera" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight uppercase leading-none">Evidence Vault</h1>
                    <p class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest mt-1">Player Photo Archive</p>
                </div>
            </div>
            <a href="index.html" class="px-4 py-2 bg-emerald-950 hover:bg-emerald-800 border border-emerald-800 rounded-xl text-xs font-black uppercase tracking-widest transition-colors flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to App
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl mx-auto w-full p-4 md:p-8 space-y-8 mt-4">
        
        <!-- Player Selector Card -->
        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-200">
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-3">Select Player to Inspect</label>
            <div class="relative">
                <select id="player-selector" onchange="window.selectPlayer(this.value)" class="w-full p-5 bg-slate-50 border-2 border-slate-200 hover:border-emerald-300 focus:border-emerald-500 rounded-[1.5rem] font-black text-slate-800 outline-none appearance-none cursor-pointer text-base md:text-lg transition-colors shadow-inner">
                    <option value="">Loading Roster...</option>
                </select>
                <div class="absolute inset-y-0 right-5 flex items-center pointer-events-none text-emerald-500">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </div>
            </div>
            
            <div id="stats-bar" class="hidden mt-6 flex flex-wrap gap-3 items-center border-t border-slate-100 pt-6">
                <div class="bg-emerald-50 border border-emerald-100 px-4 py-2 rounded-xl flex items-center gap-2">
                    <i data-lucide="image" class="w-4 h-4 text-emerald-600"></i>
                    <span class="text-xs font-black text-emerald-800 uppercase tracking-widest"><span id="photo-count">0</span> Photos Found</span>
                </div>
            </div>
        </div>

        <!-- Photo Grid -->
        <div id="photo-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <!-- Populated via Javascript -->
            <div class="col-span-full p-16 text-center text-slate-400 font-bold uppercase tracking-widest border-2 border-dashed border-slate-200 rounded-[2.5rem]">
                Select a player above to load their evidence.
            </div>
        </div>

    </main>

    <!-- Full Screen Lightbox -->
    <div id="lightbox" class="fixed inset-0 z-[1000] bg-slate-900/90 hidden flex-col items-center justify-center p-4 md:p-8 opacity-0 transition-opacity duration-300">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-slate-400 hover:text-white transition-colors bg-slate-800/80 p-3 rounded-full hover:bg-slate-700 shadow-lg border border-slate-600 active-scale">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        
        <img id="lightbox-img" src="" class="max-w-full max-h-[70vh] rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.3)] object-contain border border-slate-700">
        
        <div class="mt-6 bg-white p-5 rounded-3xl border border-slate-200 shadow-2xl text-center max-w-sm w-full">
            <h2 id="lightbox-title" class="text-lg md:text-xl font-black text-slate-800 uppercase tracking-tight leading-tight"></h2>
            <p id="lightbox-score" class="text-sm font-black text-emerald-600 uppercase tracking-widest mt-1"></p>
            <div class="flex justify-center items-center gap-1.5 mt-3 text-slate-400 text-[10px] font-bold uppercase tracking-widest bg-slate-50 py-1.5 rounded-lg border border-slate-100">
                <i data-lucide="calendar" class="w-3 h-3"></i> <span id="lightbox-date"></span>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, persistentLocalCache, initializeFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Battle Tags Configuration
        const DATABASE_FOLDER_NAME = 'friday-harbour-battle-tags';
        const firebaseConfig = {
            apiKey: "AIzaSyDf_1RE4hscqVVbHoN7Vvqoylj8elWLUn4",
            authDomain: "battletags-27390.firebaseapp.com",
            projectId: "battletags-27390",
            storageBucket: "battletags-27390.firebasestorage.app",
            messagingSenderId: "930795580018",
            appId: "1:930795580018:web:b82b95d64572483f85f0eb"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        let db;
        try { db = initializeFirestore(app, { localCache: persistentLocalCache() }); } 
        catch (e) { db = getFirestore(app); }

        // State
        let allPlayers = [];
        let allMatchesWithPhotos = [];
        let currentPlayerSelected = "";

        async function init() {
            lucide.createIcons();
            
            // Authenticate anonymously for read-only access
            try { await signInAnonymously(auth); } 
            catch (err) { console.error("Auth Failed", err); }

            const qP = collection(db, 'artifacts', DATABASE_FOLDER_NAME, 'public', 'data', 'players');
            onSnapshot(qP, (snapshot) => {
                allPlayers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => a.name.localeCompare(b.name));
                populateDropdown();
            });

            const qM = collection(db, 'artifacts', DATABASE_FOLDER_NAME, 'public', 'data', 'matches');
            onSnapshot(qM, (snapshot) => {
                const rawMatches = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // Filter down to ONLY completed matches that actually have a photo URL
                allMatchesWithPhotos = rawMatches
                    .filter(m => m.status === 'completed' && m.photoUrl && m.winner)
                    .sort((a, b) => new Date(b.date) - new Date(a.date)); // Newest first

                // Hide loading screen once data is prepped
                document.getElementById('screen-loading').style.opacity = '0';
                setTimeout(() => document.getElementById('screen-loading').classList.add('hidden'), 500);
                
                // Re-render if a player is already selected
                if (currentPlayerSelected) window.selectPlayer(currentPlayerSelected);
            });
        }

        function populateDropdown() {
            const select = document.getElementById('player-selector');
            const currentVal = select.value;
            select.innerHTML = '<option value="">Choose a player to view their photos...</option>';
            allPlayers.forEach(p => {
                const opt = new Option(p.name, p.name);
                if (p.name === currentVal) opt.selected = true;
                select.add(opt);
            });
        }

        window.selectPlayer = function(playerName) {
            currentPlayerSelected = playerName;
            const grid = document.getElementById('photo-grid');
            const statsBar = document.getElementById('stats-bar');

            if (!playerName) {
                statsBar.classList.add('hidden');
                grid.innerHTML = `<div class="col-span-full p-16 text-center text-slate-400 font-bold uppercase tracking-widest border-2 border-dashed border-slate-200 rounded-[2.5rem]">Select a player above to load their evidence.</div>`;
                return;
            }

            // Filter for matches where the player was involved (handles wins, losses, and ties)
            const playerPhotos = allMatchesWithPhotos.filter(m => 
                m.player1 === playerName || 
                m.player2 === playerName || 
                m.winner === playerName || 
                m.loser === playerName
            );

            // Update Stats UI
            statsBar.classList.remove('hidden');
            document.getElementById('photo-count').innerText = playerPhotos.length;

            if (playerPhotos.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400 font-bold uppercase tracking-widest border-2 border-dashed border-slate-200 rounded-[2.5rem] flex flex-col items-center gap-4"><i data-lucide="camera-off" class="w-10 h-10 opacity-50"></i> No photographic evidence found for ${playerName}.</div>`;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = playerPhotos.map(m => {
                const isTie = m.winner === 'Tie';
                const matchTitle = isTie ? `${m.player1} Tied ${m.player2}` : `${m.winner} def. ${m.loser}`;
                
                // Create HTML specifically formatted for the Lightbox Title
                const lightboxTitle = isTie 
                    ? `${m.player1} <span class="text-slate-400 lowercase mx-1 text-sm font-bold">tied</span> ${m.player2}` 
                    : `${m.winner} <span class="text-emerald-500 lowercase mx-1 text-sm font-bold">def.</span> ${m.loser}`;
                
                // Color code the border based on if the selected player won or lost
                let ringColor = 'hover:ring-slate-300'; // Tie
                if (!isTie) {
                    ringColor = m.winner === playerName ? 'hover:ring-emerald-400' : 'hover:ring-rose-400';
                }

                return `
                <div onclick="openLightbox('${m.photoUrl}', '${encodeURIComponent(lightboxTitle)}', '${m.score}', '${m.date}')" class="bg-white rounded-3xl p-3 shadow-md border border-slate-100 flex flex-col gap-3 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl cursor-pointer group active-scale ring-2 ring-transparent ${ringColor}">
                    <div class="block relative aspect-square rounded-2xl overflow-hidden bg-slate-100">
                        <img src="${m.photoUrl}" alt="Match Photo" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" loading="lazy">
                        
                        <!-- Overlay zoom icon on hover -->
                        <div class="absolute inset-0 bg-slate-900/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-[2px]">
                            <div class="bg-white/90 p-3 rounded-full text-slate-800 shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-transform">
                                <i data-lucide="zoom-in" class="w-5 h-5"></i>
                            </div>
                        </div>
                    </div>
                    <div class="px-2 pb-2 text-left">
                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${m.date}</p>
                        <p class="text-sm font-black text-slate-800 leading-tight uppercase truncate" title="${matchTitle}">${matchTitle}</p>
                        <p class="text-[10px] font-bold text-slate-500 mt-1 uppercase tracking-wider">${m.score}</p>
                    </div>
                </div>
            `}).join('');

            lucide.createIcons();
        };

        window.openLightbox = function(url, titleHtmlEnc, score, date) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-title').innerHTML = decodeURIComponent(titleHtmlEnc);
            document.getElementById('lightbox-score').innerText = `Score: ${score}`;
            document.getElementById('lightbox-date').innerText = date;
            
            const lb = document.getElementById('lightbox');
            lb.classList.remove('hidden');
            lb.classList.add('lightbox-fade-in');
            setTimeout(() => lb.classList.remove('opacity-0'), 10);
            
            // Prevent body scrolling while lightbox is open
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        };

        window.closeLightbox = function() {
            const lb = document.getElementById('lightbox');
            lb.classList.add('opacity-0');
            setTimeout(() => {
                lb.classList.remove('lightbox-fade-in');
                lb.classList.add('hidden');
                document.body.style.overflow = ''; // Restore scrolling
            }, 200);
        };

        // Initialize App
        init();
    </script>
</body>
</html>
