<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Battle Tag Mosaic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getFirestore, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const mosaicContainer = document.getElementById('mosaic-container');

        async function init() {
            await signInAnonymously(auth);

            // Path: artifacts/{appId}/public/data/battleTags
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'battleTags');

            onSnapshot(colRef, (snapshot) => {
                mosaicContainer.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const img = document.createElement('img');
                    img.src = data.imageUrl || '';
                    img.className = 'w-full h-32 object-cover rounded-lg shadow-lg transition-transform duration-300 hover:scale-110 z-0 hover:z-10 cursor-pointer';
                    img.onerror = () => img.src = 'https://via.placeholder.com/150';
                    mosaicContainer.appendChild(img);
                });
            }, (error) => {
                console.error("Firestore Error:", error);
            });
        }

        init();
    </script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">Battle Tag Mosaic</h1>
        <div id="mosaic-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <!-- Photos dynamically inserted here -->
        </div>
    </div>
</body>
</html>
